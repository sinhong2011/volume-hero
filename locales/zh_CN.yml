# 简体中文翻译
extName: Volume Hero
extDescription: 控制和管理任何网站的音频/视频音量

# 通用
ok: 确定
cancel: 取消
save: 保存
reset: 重置
close: 关闭

# 弹出窗口
popup:
  title: Volume Hero
  noMedia: 此页面找不到媒体
  volume: 音量
  mute: 静音
  unmute: 取消静音
  maxVolume: 最大音量 (600%)
  resetTo100: 重置为 100%
  autoApply: 页面加载时自动应用
  currentSite: 当前站点
  noActiveTab: 没有活动标签页
  playingMedia: 正在播放的媒体
  refresh: 刷新
  active: 活动
  jumpToTab: 跳转到标签页
  noPlayingMedia: 未检测到任何标签页有正在播放的媒体
  openWebsite: 打开网站以调整音量
  distortionWarning: 高音量可能导致音频失真

# 设置
settings:
  title: 设置
  language: 语言
  languageDescription: 选择您的首选语言
  languages:
    en: English (英语)
    zh_CN: 简体中文
    zh_TW: 繁體中文 (繁体中文)
