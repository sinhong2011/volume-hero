  mute: 靜音
  unmute: 取消靜音
  maxVolume: 最大音量 (600%)
  resetTo100: 重設為 100%
  autoApply: 頁面載入時自動套用
  currentSite: 目前網站
  noActiveTab: 沒有活動分頁
  playingMedia: 正在播放的媒體
  refresh: 重新整理
  active: 活動
  jumpToTab: 跳至分頁
  noPlayingMedia: 未偵測到任何分頁有正在播放的媒體
  openWebsite: 開啟網站以調整音量
  distortionWarning: 高音量可能導致音訊失真

# 設定
settings:
  title: 設定
  language: 語言
  languageDescription: 選擇您偏好的語言
  languages:
    en: English (英語)
    zh_CN: 简体中文 (簡體中文)
    zh_TW: 繁體中文
