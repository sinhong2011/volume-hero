# 繁體中文（台灣）翻譯
extName: Volume Hero
extDescription: 控制和管理任何網站的音訊/視訊音量

# 通用
ok: 確定
cancel: 取消
save: 儲存
reset: 重設
close: 關閉

# 彈出視窗
popup:
  title: Volume Hero
  noMedia: 此頁面找不到媒體
