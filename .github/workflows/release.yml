name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: |
          bun run --bun -e "
            const pkg = await Bun.file('package.json').json();
            pkg.version = '${{ steps.version.outputs.VERSION }}';
            await Bun.write('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Chrome extension
        run: bun run zip

      - name: Build Firefox extension
        run: bun run zip:firefox

      - name: Find built zip files
        id: find-zips
        run: |
          CHROME_ZIP=$(find .output -name "*chrome*.zip" | head -1)
          FIREFOX_ZIP=$(find .output -name "*firefox*.zip" | head -1)
          echo "CHROME_ZIP=$CHROME_ZIP" >> $GITHUB_OUTPUT
          echo "FIREFOX_ZIP=$FIREFOX_ZIP" >> $GITHUB_OUTPUT

      - name: Rename artifacts for release
        run: |
          mv "${{ steps.find-zips.outputs.CHROME_ZIP }}" ".output/volume-hero-${{ steps.version.outputs.VERSION }}-chrome.zip"
          mv "${{ steps.find-zips.outputs.FIREFOX_ZIP }}" ".output/volume-hero-${{ steps.version.outputs.VERSION }}-firefox.zip"

      - name: Generate release notes
        id: release-notes
        run: |
          echo "## What's Changed" > release-notes.md
          echo "" >> release-notes.md
          echo "### Downloads" >> release-notes.md
          echo "- **Chrome**: \`volume-hero-${{ steps.version.outputs.VERSION }}-chrome.zip\`" >> release-notes.md
          echo "- **Firefox**: \`volume-hero-${{ steps.version.outputs.VERSION }}-firefox.zip\`" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Installation" >> release-notes.md
          echo "1. Download the appropriate zip file for your browser" >> release-notes.md
          echo "2. Extract the contents" >> release-notes.md
          echo "3. Load as unpacked extension in developer mode" >> release-notes.md
          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "_Full changelog: https://github.com/${{ github.repository }}/compare/...v${{ steps.version.outputs.VERSION }}_" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Volume Hero v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            .output/volume-hero-${{ steps.version.outputs.VERSION }}-chrome.zip
            .output/volume-hero-${{ steps.version.outputs.VERSION }}-firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: volume-hero-chrome-v${{ steps.version.outputs.VERSION }}
          path: .output/chrome-mv3
          retention-days: 90

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: volume-hero-firefox-v${{ steps.version.outputs.VERSION }}
          path: .output/firefox-mv2
          retention-days: 90

