name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run compile

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        browser: [chrome, firefox]
        include:
          - browser: chrome
            build-command: bun run build
            output-dir: .output/chrome-mv3
          - browser: firefox
            build-command: bun run build:firefox
            output-dir: .output/firefox-mv2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for ${{ matrix.browser }}
        run: ${{ matrix.build-command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: volume-hero-${{ matrix.browser }}
          path: ${{ matrix.output-dir }}
          retention-days: 7
          if-no-files-found: error

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, build]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build failed!"
            exit 1
          fi
          echo "All checks passed!"
